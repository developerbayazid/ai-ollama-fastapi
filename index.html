<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Phi3</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #212121;
            --bg-assistant: #2f2f2f;
            --bg-input: #2f2f2f;
            --border: #424242;
            --text: #ececec;
            --text-muted: #b4b4b4;
            --accent: #10a37f;
            --content-width: 768px;
        }

        html, body {
            height: 100%;
        }

        body {
            background: var(--bg-primary);
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #565656;
            border-radius: 4px;
        }

        .empty-state {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text-muted);
            font-size: 28px;
            font-weight: 500;
            text-align: center;
        }

        .message {
            width: 100%;
            border-bottom: 1px solid transparent;
        }

        .message.user {
            background: var(--bg-primary);
        }

        .message.assistant {
            background: var(--bg-assistant);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .message-inner {
            width: 100%;
            max-width: var(--content-width);
            margin: 0 auto;
            padding: 24px 16px;
            line-height: 1.75;
            font-size: 16px;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .message-content {
            width: 100%;
            overflow-x: hidden;
        }

        .message-content > *:last-child {
            margin-bottom: 0;
        }

        .message-content p {
            margin-bottom: 16px;
        }

        .message-content h1,
        .message-content h2,
        .message-content h3,
        .message-content h4 {
            margin: 20px 0 12px;
            font-weight: 600;
            line-height: 1.4;
        }

        .message-content ul,
        .message-content ol {
            padding-left: 24px;
            margin-bottom: 16px;
        }

        .message-content li {
            margin-bottom: 6px;
        }

        .message-content blockquote {
            border-left: 3px solid var(--border);
            padding-left: 16px;
            margin: 16px 0;
            color: var(--text-muted);
        }

        .message-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            table-layout: fixed;
        }

        .message-content th,
        .message-content td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            text-align: left;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .message-content th {
            background: #1a1a1a;
        }

        .message-content a {
            color: #7ab7ff;
            text-decoration: underline;
        }

        .message-content pre {
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin: 16px 0;
            overflow-x: hidden;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .message-content pre code {
            display: block;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
            background: transparent;
            padding: 0;
        }

        .message-content :not(pre) > code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.9em;
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 6px;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .message-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .input-container {
            padding: 16px 16px 24px;
            background: var(--bg-primary);
        }

        .input-wrapper {
            max-width: var(--content-width);
            margin: 0 auto;
        }

        .input-box {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 26px;
            display: flex;
            align-items: flex-end;
            padding: 10px 10px 10px 18px;
            gap: 8px;
            box-shadow: 0 0 0 0 transparent;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .input-box:focus-within {
            border-color: #6b6b6b;
            box-shadow: 0 0 0 1px #6b6b6b;
        }

        textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            color: var(--text);
            font-family: inherit;
            font-size: 16px;
            line-height: 24px;
            min-height: 24px;
            max-height: 200px;
            overflow-y: auto;
            padding: 4px 0;
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s, opacity 0.15s;
        }

        .send-btn:hover:not(:disabled) {
            background: #0d8f6f;
        }

        .send-btn:disabled {
            background: #404040;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .footer-note {
            max-width: var(--content-width);
            margin: 10px auto 0;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="chat-container" id="chatContainer">
    <div class="empty-state" id="emptyState">What can I help with?</div>
</div>

<div class="input-container">
    <div class="input-wrapper">
        <div class="input-box">
            <textarea
                    id="messageInput"
                    placeholder="Message Phi3"
                    rows="1"
            ></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled aria-label="Send message">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z" transform="rotate(-90 12 12)"/>
                </svg>
            </button>
        </div>
        <div class="footer-note">Phi3 can make mistakes. Check important info.</div>
    </div>
</div>

<script>
    const chatContainer = document.getElementById("chatContainer");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const emptyState = document.getElementById("emptyState");

    let isSending = false;

    function autoResizeTextarea() {
        messageInput.style.height = "24px";
        messageInput.style.height = Math.min(messageInput.scrollHeight, 200) + "px";
    }

    function updateSendButton() {
        sendBtn.disabled = isSending || !messageInput.value.trim();
    }

    function hideEmptyState() {
        if (emptyState) {
            emptyState.remove();
        }
    }

    function appendMessage(role) {
        hideEmptyState();

        const wrapper = document.createElement("div");
        wrapper.className = `message ${role}`;

        const inner = document.createElement("div");
        inner.className = "message-inner";

        const content = document.createElement("div");
        content.className = "message-content";

        inner.appendChild(content);
        wrapper.appendChild(inner);
        chatContainer.appendChild(wrapper);

        chatContainer.scrollTop = chatContainer.scrollHeight;

        return content;
    }

    function renderMarkdown(element, text) {
        element.innerHTML = marked.parse(text);
        element.querySelectorAll("pre code").forEach((el) => {
            hljs.highlightElement(el);
        });
    }

    async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message || isSending) return;

        isSending = true;
        updateSendButton();

        const userContent = appendMessage("user");
        renderMarkdown(userContent, message);

        messageInput.value = "";
        autoResizeTextarea();

        const assistantContent = appendMessage("assistant");
        let fullText = "";

        try {
            const response = await fetch(
                `http://127.0.0.1:8000/chat?message=${encodeURIComponent(message)}`,
                { method: "POST" }
            );

            if (!response.ok) {
                throw new Error("Request failed");
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                fullText += decoder.decode(value, { stream: true });
                renderMarkdown(assistantContent, fullText);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        } catch (error) {
            assistantContent.textContent = "Something went wrong. Make sure the server is running.";
        } finally {
            isSending = false;
            updateSendButton();
            messageInput.focus();
        }
    }

    messageInput.addEventListener("input", () => {
        autoResizeTextarea();
        updateSendButton();
    });

    messageInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    autoResizeTextarea();
    updateSendButton();
</script>

</body>
</html>
